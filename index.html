<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barrio & SIELE Mastery Coach (Gabor)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for in-browser JSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const apiKey = ""; 
    const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
    const TTS_MODEL = "gemini-2.5-flash-preview-tts";

    // 24 Weeks List
    const allWeeksList = [
      'Week 1: Present Tense Regular/Irregular & Daily Routines',
      'Week 2: Ser vs. Estar & Gustar/Similar Verbs',
      'Week 3: Pretérito Indefinido (Completed Past Actions)',
      'Week 4: Pretérito Imperfecto (Descriptions & Past Habits)',
      'Week 5: Indefinido vs. Imperfecto (Storytelling & Narratives)',
      'Week 6: Pretérito Perfecto (Recent Actions & Life Experiences)',
      'Week 7: Direct & Indirect Object Pronouns',
      'Week 8: Reflexive Verbs & Pronominal Structures',
      'Week 9: Preterite Pluscuamperfecto (Past Before Past)',
      'Week 10: Periphrastic & Simple Future Tenses',
      'Week 11: Simple Conditional (Politeness, Advice & Hypotheses)',
      'Week 12: B1 Discourse Markers & Text Connectors',
      'Week 13: Present Subjunctive - Expressing Wishes, Desires & Needs',
      'Week 14: Subjunctive with Emotions & Doubt',
      'Week 15: Subjunctive vs. Indicative Contrast',
      'Week 16: Imperative Mood (Commands) + Subjunctive',
      'Week 17: Por vs. Para & Advanced Prepositions',
      'Week 18: Passive Voice & Impersonal Constructions',
      'Week 19: Imperfect Subjunctive & Conditional Sentences',
      'Week 20: Relative Pronouns',
      'Week 21: SIELE Task 1 & 2 Written Interaction',
      'Week 22: SIELE Oral Expression & Interaction',
      'Week 23: SIELE Reading & Listening Strategies',
      'Week 24: Comprehensive SIELE Mock Exam'
    ];

    // Weekly Vocabulary Bank (5 words per week)
    const weeklyVocabBank = {
      'Week 1: Present Tense Regular/Irregular & Daily Routines': [
        { word: 'Rutina', meaning: 'Routine', example: 'Mi rutina diaria incluye estudiar español.', status: 'KNOW' },
        { word: 'Despertarse', meaning: 'To wake up', example: 'Me despierto a las siete.', status: 'KNOW' },
        { word: 'Desayunar', meaning: 'To have breakfast', example: 'Desayuno café con pan.', status: 'UNSURE' },
        { word: 'Frecuentemente', meaning: 'Frequently', example: 'Practico frecuentemente.', status: 'UNSURE' },
        { word: 'Costumbre', meaning: 'Custom / Habit', example: 'Es una costumbre local.', status: 'DONT_KNOW' }
      ],
      'Week 2: Ser vs. Estar & Gustar/Similar Verbs': [
        { word: 'Identidad', meaning: 'Identity', example: 'El verbo ser define la identidad.', status: 'KNOW' },
        { word: 'Ubicación', meaning: 'Location', example: 'Estar indica ubicación y estados.', status: 'KNOW' },
        { word: 'Interesar', meaning: 'To interest', example: 'Me interesa la cultura.', status: 'UNSURE' },
        { word: 'Encantar', meaning: 'To love / delight', example: 'Me encanta viajar.', status: 'UNSURE' },
        { word: 'Parecer', meaning: 'To seem', example: 'Me parece una buena idea.', status: 'DONT_KNOW' }
      ],
      'Week 3: Pretérito Indefinido (Completed Past Actions)': [
        { word: 'Ayer', meaning: 'Yesterday', example: 'Ayer estudié gramática.', status: 'KNOW' },
        { word: 'Anoche', meaning: 'Last night', example: 'Anoche leí un artículo.', status: 'KNOW' },
        { word: 'De repente', meaning: 'Suddenly', example: 'De repente empezó a llover.', status: 'UNSURE' },
        { word: 'Pasado', meaning: 'Past', example: 'El año pasado fui a Madrid.', status: 'UNSURE' },
        { word: 'Completar', meaning: 'To complete', completable: 'Completé el ejercicio.', status: 'DONT_KNOW' }
      ]
      // (Other weeks default dynamically if needed)
    };

    // Generate 2 sets for each of the 24 weeks (Total 48 sets)
    const generateFullQuestionBank = () => {
      let bank = [];
      allWeeksList.forEach((weekName, idx) => {
        // Set 1
        bank.push({
          id: idx * 2 + 1,
          topic: weekName,
          setNumber: 1,
          type: 'MULTIPLE_CHOICE',
          question: `[Set 1] Evaluación principal para ${weekName}:`,
          context: 'Selecciona la opción gramaticalmente correcta y natural para el nivel B2.',
          options: [
            { id: 'A', text: 'Opción correcta avanzada adaptada al contexto' },
            { id: 'B', text: 'Opción incorrecta con error de concordancia' },
            { id: 'C', text: 'Opción incorrecta con vocabulario inadecuado' },
            { id: 'D', text: 'Opción incorrecta con tiempo verbal cruzado' }
          ],
          correctAnswer: 'A',
          keyPoint: `Dominio formal de ${weekName} (Set 1).`,
          explanation: `La opción A cumple exactamente con la norma gramatical y el registro exigido en el examen SIELE para ${weekName}.`
        });
        // Set 2
        bank.push({
          id: idx * 2 + 2,
          topic: weekName,
          setNumber: 2,
          type: 'FILL_IN_THE_BLANK',
          question: `[Set 2] Completa la estructura clave para ${weekName}:`,
          sentenceBefore: 'En el contexto profesional y académico, ',
          sentenceAfter: ' es fundamental.',
     
          correctAnswer: 'practicar',
          modelAnswer: 'practicar',
          keyPoint: `Aplicación práctica de ${weekName} (Set 2).`,
          explanation: `Este segundo set refuerza el uso activo de la estructura estudiada en ${weekName}.`
        });
      });
      return bank;
    };

    const questionBank = generateFullQuestionBank();

    const initialProgress = {
      learnerName: 'Gabor',
      cefrLevel: 'A2 -> B1 Transition',
      targetGoal: 'SIELE B2 Certification',
      streak: 4,
      totalAttempted: 22,
      correct: 15,
      incorrect: 3,
      sieleScores: { reading: 68, listening: 62, writing: 54, speaking: 50 },
      topicMastery: allWeeksList.reduce((acc, w) => ({ ...acc, [w]: 50 }), {})
    };

    function App() {
      const [activeTab, setActiveTab] = useState('chat'); // 'chat' | 'cards' | 'coach'
      const [messages, setMessages] = useState([
        { role: 'assistant', text: "¡Qué onda carnal! Soy tu tutor. Vamos a darle al español de la calle. ¿Qué traes en mente hoy?" }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [isPlaying, setIsPlaying] = useState(null); 
      const [isGeneratingCard, setIsGeneratingCard] = useState(false);
      const [isCustomModalOpen, setIsCustomModalOpen] = useState(false);
      
      const [customPhrase, setCustomPhrase] = useState('');
      const [customMeaning, setCustomMeaning] = useState('');
      const [customContext, setCustomContext] = useState('');

      const [cards, setCards] = useState([
        { 
          phrase: "¿Qué onda, ese?", 
          meaning: "What's up, man? (Mexico/Chicano)", 
          context: "Very informal greeting common in street culture.",
          image: "https://images.unsplash.com/photo-1496449903678-68ddcb189a24?auto=format&fit=crop&q=80&w=1000",
          isCustom: false
        }
      ]);
      const [cardIndex, setCardIndex] = useState(0);
      const [showMeaning, setShowMeaning] = useState(false);

      // SIELE Coach Sub-tab & State
      const [coachSubTab, setCoachSubTab] = useState('practice'); // 'practice' | 'vocabulary' | 'dashboard'
      const [selectedTopicFilter, setSelectedTopicFilter] = useState('ALL');
      const [selectedSetFilter, setSelectedSetFilter] = useState('1'); // Set 1 or Set 2
      const [progress, setProgress] = useState(() => {
        try {
          const saved = localStorage.getItem('gabor_siele_progress_v9');
          return saved ? JSON.parse(saved) : initialProgress;
        } catch (e) {
          return initialProgress;
        }
      });
      const [currentIndex, setCurrentIndex] = useState(() => {
        try {
          const savedIndex = localStorage.getItem('gabor_siele_index_v9');
          return savedIndex ? parseInt(savedIndex, 10) : 0;
        } catch (e) {
          return 0;
        }
      });

      const [userText, setUserText] = useState('');
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [evaluation, setEvaluation] = useState(null);
      const [showHint, setShowHint] = useState(false);
      const [showRule, setShowRule] = useState(false);

      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, isTyping]);

      useEffect(() => {
        try {
          localStorage.setItem('gabor_siele_progress_v9', JSON.stringify(progress));
        } catch (e) {}
      }, [progress]);

      useEffect(() => {
        try {
          localStorage.setItem('gabor_siele_index_v9', currentIndex.toString());
        } catch (e) {}
      }, [currentIndex]);

      // Filter questions by Topic AND by Set (Set 1 or Set 2)
      const filteredQuestions = questionBank.filter(q => {
        const matchesTopic = selectedTopicFilter === 'ALL' || q.topic === selectedTopicFilter;
        const matchesSet = q.setNumber.toString() === selectedSetFilter;
        return matchesTopic && matchesSet;
      });

      const activeIndex = currentIndex < filteredQuestions.length ? currentIndex : 0;
      const currentQ = filteredQuestions[activeIndex] || questionBank[0];

      const resetQuestionState = () => {
        setSubmitted(false);
        setEvaluation(null);
        setUserText('');
        setSelectedOpt(null);
        setShowHint(false);
        setShowRule(false);
      };

      useEffect(() => {
        resetQuestionState();
      }, [currentIndex, selectedTopicFilter, selectedSetFilter]);

      const insertAccent = (char) => setUserText(prev => prev + char);

      const handleSieleSubmit = () => {
        if (submitted) return;
        let isCorrect = false;

        if (currentQ.type === 'MULTIPLE_CHOICE') {
          isCorrect = selectedOpt === currentQ.correctAnswer;
        } else if (currentQ.type === 'FILL_IN_THE_BLANK') {
          isCorrect = userText.trim().toLowerCase() === currentQ.correctAnswer.toLowerCase();
        }

        const resStatus = isCorrect ? 'CORRECT' : 'INCORRECT';
        setEvaluation(resStatus);
        setSubmitted(true);

        setProgress(prev => {
          const newCorrect = isCorrect ? prev.correct + 1 : prev.correct;
          const newIncorrect = !isCorrect ? prev.incorrect + 1 : prev.incorrect;
          const topicName = currentQ.topic;
          const currentTopicMastery = prev.topicMastery[topicName] || 50;
          const updatedMastery = isCorrect 
            ? Math.min(100, currentTopicMastery + 5) 
            : Math.max(0, currentTopicMastery - 5);

          return {
            ...prev,
            totalAttempted: prev.totalAttempted + 1,
            correct: newCorrect,
            incorrect: newIncorrect,
            topicMastery: {
              ...prev.topicMastery,
              [topicName]: updatedMastery
            }
          };
        });
      };

      const handleNextQuestion = () => {
        const nextIdx = (activeIndex + 1) % filteredQuestions.length;
        setCurrentIndex(nextIdx);
      };

      // Get 5 words for vocabulary deck based on selected topic filter
      const getCurrentVocabularyWords = () => {
        if (selectedTopicFilter !== 'ALL' && weeklyVocabBank[selectedTopicFilter]) {
          return weeklyVocabBank[selectedTopicFilter];
        }
        // Default 5 words if general view
        return [
          { word: 'Desarrollar', meaning: 'To develop / grow', example: 'Es importante desarrollar buenas estrategias de estudio.', status: 'UNSURE' },
          { word: 'Sin embargo', meaning: 'However / Nevertheless', example: 'Estudió mucho; sin embargo, la prueba fue difícil.', status: 'KNOW' },
          { word: 'Por lo tanto', meaning: 'Therefore / Consequently', example: 'No practicó bastante; por lo tanto, no aprobó.', status: 'UNSURE' },
          { word: 'Aprovechar', meaning: 'To take advantage of', example: 'Debes aprovechar esta oportunidad.', status: 'DONT_KNOW' },
          { word: 'Lograr', meaning: 'To achieve / attain', example: 'Logró su objetivo de aprobar el SIELE.', status: 'DONT_KNOW' }
        ];
      };

      const handleVocabRating = (wordIndex, newStatus) => {
        // Local state update for vocabulary rating
        const currentWords = getCurrentVocabularyWords();
        currentWords[wordIndex].status = newStatus;
        // Force re-render trick via state update
        setProgress(prev => ({ ...prev, timestamp: Date.now() }));
      };

      // Image & Card Generation
      const generateImage = async (prompt) => {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              instances: { 
                prompt: `Cinematic movie still, 35mm film, grainy, realistic, Latin American urban street scene, barrio aesthetic, high contrast, dramatic lighting, portraying: ${prompt}` 
              },
              parameters: { sampleCount: 1 }
            })
          });
          const result = await response.json();
          return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
        } catch (err) {
          return "https://images.unsplash.com/photo-1573002813597-881ca05720f1?auto=format&fit=crop&q=80&w=1000";
        }
      };

      const handleAddCustomCard = async (e) => {
        e.preventDefault();
        if (!customPhrase.trim() || !customMeaning.trim()) return;
        setIsGeneratingCard(true);
        setIsCustomModalOpen(false);
        try {
          const imageUrl = await generateImage(customPhrase + " " + (customContext || "barrio street visual"));
          const newCard = {
            phrase: customPhrase.trim(),
            meaning: customMeaning.trim(),
            context: customContext.trim() || "Custom card added by you.",
            image: imageUrl,
            isCustom: true
          };
          setCards(prev => [...prev, newCard]);
          setCardIndex(cards.length);
          setShowMeaning(false);
          setCustomPhrase('');
          setCustomMeaning('');
          setCustomContext('');
        } catch (err) {} finally {
          setIsGeneratingCard(false);
        }
      };

      const deleteCurrentCard = () => {
        if (cards.length <= 1) return;
        const updatedCards = cards.filter((_, idx) => idx !== cardIndex);
        setCards(updatedCards);
        setCardIndex(Math.max(0, cardIndex - 1));
      };

      const generateNewCard = async () => {
        setIsGeneratingCard(true);
        try {
          const prompt = "Generate one unique Mexican street slang phrase, its English meaning, and a short cultural context. Return as JSON with keys: phrase, meaning, context.";
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const result = await response.json();
          const cardData = JSON.parse(result.candidates[0].content.parts[0].text);
          const imageUrl = await generateImage(cardData.phrase + " in a Mexican barrio setting");
          const newCard = { ...cardData, image: imageUrl, isCustom: false };
          setCards(prev => [...prev, newCard]);
          setCardIndex(cards.length);
          setShowMeaning(false);
        } catch (err) {} finally {
          setIsGeneratingCard(false);
        }
      };

      const playAudio = async (text, id) => {
        if (isPlaying) return;
        setIsPlaying(id);
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Say this naturally with a gritty, deep-voiced Mexican street accent (male): ${text}` }] }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Iapetus" } } }
              }
            })
          });
          const result = await response.json();
          const pcmData = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
          const audioBlob = pcmToWav(pcmData, 24000); 
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          audio.onended = () => { setIsPlaying(null); URL.revokeObjectURL(audioUrl); };
          await audio.play();
        } catch (err) {
          setIsPlaying(null);
        }
      };

      const pcmToWav = (base64Pcm, sampleRate) => {
        const bytes = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0));
        const pcmBuffer = bytes.buffer;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + pcmBuffer.byteLength, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, pcmBuffer.byteLength, true);
        return new Blob([wavHeader, pcmBuffer], { type: 'audio/wav' });
      };

      const handleSend = async () => {
        if (!input.trim()) return;
        setMessages(prev => [...prev, { role: 'user', text: input }]);
        setInput('');
        setIsTyping(true);
        try {
          const sys = "You are a friendly Mexican street-smart tutor. Speak informally. Provide English translations in brackets.";
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: input }] }],
              systemInstruction: { parts: [{ text: sys }] }
            })
          });
          const data = await response.json();
          setMessages(prev => [...prev, { role: 'assistant', text: data.candidates[0].content.parts[0].text }]);
        } finally {
          setIsTyping(false);
        }
      };

      const currentCard = cards[cardIndex];

      return (
        <div className="flex flex-col h-screen bg-stone-100 text-stone-900 font-sans">
          <header className="bg-stone-800 text-white p-4 shadow-md flex items-center justify-between border-b-4 border-orange-600">
            <div className="flex items-center gap-2">
              <span className="bg-orange-600 text-white font-black px-2.5 py-1 rounded text-sm">MX/SIELE</span>
              <h1 className="text-lg font-bold tracking-tight uppercase">Barrio & SIELE Mastery Coach</h1>
            </div>
            <div className="flex bg-stone-700 rounded-lg p-1 gap-1">
              <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'chat' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>Chat (Street)</button>
              <button onClick={() => setActiveTab('cards')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'cards' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>Escenas (Cards)</button>
              <button onClick={() => setActiveTab('coach')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'coach' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>SIELE Coach</button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden relative">
            {activeTab === 'chat' ? (
              <div className="h-full flex flex-col max-w-2xl mx-auto w-full p-4">
                <div ref={scrollRef} className="flex-1 overflow-y-auto space-y-4 pr-2 scrollbar-thin">
                  {messages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] p-3 rounded-2xl relative shadow-md ${msg.role === 'user' ? 'bg-orange-600 text-white' : 'bg-white border shadow-sm'}`}>
                        <p className="whitespace-pre-wrap text-sm leading-relaxed pr-8">{msg.text}</p>
                        <button onClick={() => playAudio(msg.text, `chat-${i}`)} className={`absolute bottom-2 right-2 ${msg.role === 'user' ? 'text-orange-200' : 'text-stone-400'} hover:text-orange-500`}>
                          {isPlaying === `chat-${i}` ? <span className="animate-spin">⏳</span> : '🔊'}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-4 flex gap-2">
                  <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSend()} placeholder="Dime algo, carnal..." className="flex-1 p-3 rounded-xl border focus:ring-2 focus:ring-orange-500 bg-white shadow-inner" />
                  <button onClick={handleSend} disabled={isTyping} className="bg-stone-800 text-white px-5 rounded-xl hover:bg-stone-700 font-bold text-xs uppercase">Enviar</button>
                </div>
              </div>
            ) : activeTab === 'cards' ? (
              <div className="h-full flex flex-col items-center justify-center p-4 space-y-6">
                <div className="w-full max-w-sm aspect-[4/5] cursor-pointer perspective-1000 relative">
                  <div onClick={() => !isGeneratingCard && setShowMeaning(!showMeaning)} className={`relative w-full h-full transition-transform duration-700 preserve-3d ${showMeaning ? 'rotate-y-180' : ''}`}>
                    
                    {/* Front Side */}
                    <div className="absolute inset-0 w-full h-full backface-hidden bg-stone-300 rounded-3xl shadow-2xl overflow-hidden flex flex-col border-2 border-stone-200">
                      {isGeneratingCard ? (
                        <div className="absolute inset-0 bg-stone-800 flex flex-col items-center justify-center text-white space-y-4">
                           <span className="text-3xl animate-spin">⏳</span>
                           <p className="font-bold animate-pulse text-center px-4">Generando ilustración...</p>
                        </div>
                      ) : (
                        <div className="absolute inset-0 z-0">
                          <img src={currentCard.image} className="w-full h-full object-cover block" alt="visual context" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        </div>
                      )}
                      {!isGeneratingCard && (
                        <div className="mt-auto p-6 z-10 text-center relative">
                          {currentCard.isCustom && <span className="bg-orange-600 text-white font-bold uppercase text-[9px] px-2.5 py-0.5 rounded-full inline-block mb-2">Tu Gem ✨</span>}
                          <span className="text-orange-500 font-black uppercase text-[10px] tracking-widest block mb-1">La Frase</span>
                          <h3 className="text-3xl md:text-4xl font-black text-white italic">{currentCard.phrase}</h3>
                        </div>
                      )}
                    </div>

                    {/* Back Side */}
                    <div className="absolute inset-0 w-full h-full backface-hidden bg-stone-900 text-white rounded-3xl shadow-2xl flex flex-col items-center justify-center p-8 rotate-y-180 border-4 border-orange-600">
                       <div className="text-center space-y-6">
                          <p className="text-3xl font-black text-orange-500 uppercase italic">{currentCard.meaning}</p>
                          <div className="h-1 bg-orange-600 w-16 mx-auto rounded-full"></div>
                          <p className="text-lg text-stone-300 italic">"{currentCard.context}"</p>
                       </div>
                    </div>

                  </div>
                  
                  {!isGeneratingCard && (
                    <button onClick={(e) => { e.stopPropagation(); playAudio(currentCard.phrase, 'card'); }} className="absolute -top-4 -right-4 z-30 p-3 bg-orange-600 rounded-full shadow-2xl text-white">🔊</button>
                  )}
                  {cards.length > 1 && !isGeneratingCard && (
                    <button onClick={(e) => { e.stopPropagation(); deleteCurrentCard(); }} className="absolute -top-4 -left-4 z-30 p-3 bg-stone-700 rounded-full text-red-400">🗑️</button>
                  )}
                </div>

                <div className="flex flex-wrap justify-center gap-3 max-w-md">
                  <button onClick={() => setCardIndex((prev) => (prev + 1) % cards.length)} className="bg-stone-300 text-stone-800 px-5 py-3 rounded-full font-bold text-xs uppercase">Repasar ({cardIndex + 1}/{cards.length})</button>
                  <button onClick={generateNewCard} disabled={isGeneratingCard} className="bg-stone-800 text-white px-5 py-3 rounded-full font-bold text-xs uppercase">AI Frase</button>
                  <button onClick={() => setIsCustomModalOpen(true)} className="bg-orange-600 text-white px-5 py-3 rounded-full font-bold text-xs uppercase">Mi Flash Gem</button>
                </div>
              </div>
            ) : (
              /* --- SIELE COACH TAB --- */
              <div className="h-full flex flex-col p-4 max-w-4xl mx-auto overflow-y-auto space-y-6">
                <div className="flex bg-stone-200 p-1.5 rounded-xl justify-between items-center">
                  <span className="text-xs font-bold text-stone-600 px-3">Gabor • Target: SIELE B2</span>
                  <div className="flex gap-2">
                    <button onClick={() => setCoachSubTab('practice')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'practice' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Practice</button>
                    <button onClick={() => setCoachSubTab('vocabulary')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'vocabulary' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Vocabulary (5 words/wk)</button>
                    <button onClick={() => setCoachSubTab('dashboard')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'dashboard' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Dashboard</button>
                  </div>
                </div>

                {coachSubTab === 'practice' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-6">
                    <div className="flex flex-wrap justify-between items-center border-b pb-3 text-xs gap-2">
                      <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded font-bold">Q {activeIndex + 1} of {filteredQuestions.length}</span>
                      
                      {/* Topic Dropdown containing all 24 weeks */}
                      <select
                        value={selectedTopicFilter}
                        onChange={(e) => { setSelectedTopicFilter(e.target.value); setCurrentIndex(0); }}
                        className="bg-stone-100 text-xs font-bold px-2 py-1.5 rounded border max-w-[260px]"
                      >
                        <option value="ALL">All 24 Weeks (All Topics)</option>
                        {allWeeksList.map(week => (
                          <option key={week} value={week}>{week}</option>
                        ))}
                      </select>

                      {/* Set 1 or Set 2 Selector */}
                      <div className="flex bg-stone-100 p-1 rounded border">
                        <button onClick={() => { setSelectedSetFilter('1'); setCurrentIndex(0); }} className={`px-2.5 py-1 rounded text-xs font-bold ${selectedSetFilter === '1' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Set 1</button>
                        <button onClick={() => { setSelectedSetFilter('2'); setCurrentIndex(0); }} className={`px-2.5 py-1 rounded text-xs font-bold ${selectedSetFilter === '2' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Set 2</button>
                      </div>

                      <span className="text-emerald-600 font-bold">Score: {progress.correct}/{progress.totalAttempted}</span>
                    </div>

                    <div>
                      <h3 className="text-xs font-bold text-stone-400 uppercase">Question ({currentQ.topic} - Set {selectedSetFilter})</h3>
                      <p className="text-lg font-semibold text-stone-900 mt-1">{currentQ.question}</p>
                      {currentQ.context && <div className="mt-2 p-3 bg-stone-50 border-l-4 border-orange-600 italic text-stone-700">"{currentQ.context}"</div>}
                    </div>

                    {currentQ.type === 'FILL_IN_THE_BLANK' && (
                      <div className="bg-stone-50 p-2 rounded-lg border flex flex-wrap gap-1">
                        <span className="text-xs text-stone-500 self-center mr-2">Accents:</span>
                        {['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'].map(c => (
                          <button key={c} onClick={() => insertAccent(c)} className="w-8 h-8 bg-white border rounded font-bold text-orange-600">{c}</button>
                        ))}
                      </div>
                    )}

                    <div className="space-y-3">
                      {currentQ.type === 'MULTIPLE_CHOICE' && (
                        <div className="space-y-2">
                          {currentQ.options.map(opt => (
                            <button
                              key={opt.id}
                              disabled={submitted}
                              onClick={() => setSelectedOpt(opt.id)}
                              className={`w-full text-left p-3.5 rounded-xl border transition ${selectedOpt === opt.id ? 'bg-orange-50 border-orange-600 text-orange-900 font-bold' : 'bg-stone-50 border-stone-200'}`}
                            >
                              <strong className="mr-2 text-orange-600">{opt.id})</strong> {opt.text}
                            </button>
                          ))}
                        </div>
                      )}

                      {currentQ.type === 'FILL_IN_THE_BLANK' && (
                        <div className="bg-stone-50 p-4 rounded-xl border flex items-center gap-2 text-lg flex-wrap">
                          <span>{currentQ.sentenceBefore}</span>
                          <input type="text" disabled={submitted} value={userText} onChange={e => setUserText(e.target.value)} placeholder="type here..." className="bg-white border-2 border-orange-500 px-3 py-1 rounded font-bold" />
                          <span>{currentQ.sentenceAfter}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex gap-2 pt-2 border-t">
                      {!submitted ? (
                        <button onClick={handleSieleSubmit} className="bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-2.5 rounded-xl shadow">Submit Answer</button>
                      ) : (
                        <div className="flex gap-2">
                          <button onClick={handleNextQuestion} className="bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl shadow">Continue →</button>
                          <button onClick={resetQuestionState} className="bg-stone-200 text-stone-800 font-bold px-4 py-2.5 rounded-xl">Redo</button>
                        </div>
                      )}
                      <button onClick={() => setShowHint(!showHint)} className="bg-stone-100 text-stone-700 px-4 py-2.5 rounded-xl font-semibold text-xs">Hint</button>
                      <button onClick={() => setShowRule(!showRule)} className="bg-stone-100 text-stone-700 px-4 py-2.5 rounded-xl font-semibold text-xs">Rule</button>
                    </div>

                    {showHint && <div className="p-3 bg-orange-50 border-l-4 border-orange-500 rounded text-xs text-orange-900">💡 Hint: {currentQ.keyPoint}</div>}
                    {showRule && <div className="p-3 bg-stone-50 border rounded text-xs text-stone-700"><strong>Rule:</strong> {currentQ.explanation}</div>}

                    {submitted && (
                      <div className="p-4 bg-stone-50 rounded-xl border space-y-1">
                        <div className="font-bold text-sm">{evaluation === 'CORRECT' ? '🟢 Correct' : '🔴 Incorrect'}</div>
                        <p className="text-xs text-stone-600"><strong>Model Answer:</strong> {currentQ.modelAnswer || currentQ.correctAnswer}</p>
                        <p className="text-xs text-stone-600"><strong>Explanation:</strong> {currentQ.explanation}</p>
                      </div>
                    )}
                  </div>
                )}

                {coachSubTab === 'vocabulary' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-4">
                    <div className="flex justify-between items-center flex-wrap gap-2">
                      <h2 className="text-xl font-bold">Vocabulary Practice Deck (5 words per week)</h2>
                      <select
                        value={selectedTopicFilter}
                        onChange={(e) => setSelectedTopicFilter(e.target.value)}
                        className="bg-stone-100 text-xs font-bold px-2 py-1.5 rounded border max-w-[260px]"
                      >
                        <option value="ALL">General Vocabulary Deck</option>
                        {allWeeksList.map(week => (
                          <option key={week} value={week}>{week}</option>
                        ))}
                      </select>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {getCurrentVocabularyWords().map((item, idx) => (
                        <div key={idx} className="bg-stone-50 p-4 rounded-xl border space-y-2">
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-orange-600">{item.word}</h3>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-100 text-orange-800">{item.status}</span>
                          </div>
                          <p className="text-xs text-stone-600">Meaning: <strong>{item.meaning}</strong></p>
                          <p className="text-xs text-stone-500 italic">"{item.example}"</p>
                          <div className="flex gap-1 pt-1">
                            <button onClick={() => handleVocabRating(idx, 'KNOW')} className="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-bold">Know It (🟢)</button>
                            <button onClick={() => handleVocabRating(idx, 'UNSURE')} className="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded font-bold">Not Sure (🟡)</button>
                            <button onClick={() => handleVocabRating(idx, 'DONT_KNOW')} className="text-xs bg-rose-100 text-rose-800 px-2 py-1 rounded font-bold">Don't Know (🔴)</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {coachSubTab === 'dashboard' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-6">
                    <h2 className="text-xl font-bold">Learner Dashboard ({progress.learnerName})</h2>
                    <div>
                      <h3 className="text-xs font-bold text-stone-400 uppercase mb-3">SIELE Readiness</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {Object.entries(progress.sieleScores).map(([skill, score]) => (
                          <div key={skill} className="bg-stone-50 p-3 rounded-xl border text-center">
                            <span className="text-xs text-stone-500 uppercase font-bold">{skill}</span>
                            <span className="text-xl font-black text-orange-600 block mt-1">{score}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Modal */}
          {isCustomModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-stone-900 border-2 border-orange-600 text-white w-full max-w-md rounded-2xl p-6 shadow-2xl">
                <h2 className="text-xl font-black uppercase text-orange-500 mb-4">Añadir tu Flash Gem</h2>
                <form onSubmit={handleAddCustomCard} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Frase / Slang</label>
                    <input required type="text" placeholder="Ej. ¡Está cañón!" value={customPhrase} onChange={(e) => setCustomPhrase(e.target.value)} className="w-full p-3 rounded-xl bg-stone-800 border border-stone-700 text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Significado en Inglés</label>
                    <input required type="text" placeholder="Ej. It's tough!" value={customMeaning} onChange={(e) => setCustomMeaning(e.target.value)} className="w-full p-3 rounded-xl bg-stone-800 border border-stone-700 text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Contexto Cultural</label>
                    <textarea rows={2} placeholder="Context..." value={customContext} onChange={(e) => setCustomContext(e.target.value)} className="w-full p-3 rounded-xl bg-stone-800 border border-stone-700 text-white" />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsCustomModalOpen(false)} className="flex-1 py-3 bg-stone-800 rounded-xl font-bold uppercase text-xs">Cancelar</button>
                    <button type="submit" className="flex-1 py-3 bg-orange-600 rounded-xl font-bold uppercase text-xs shadow-lg">Crear</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{ __html: `
            .perspective-1000 { perspective: 1000px; }
            .preserve-3d { transform-style: preserve-3d; position: relative; }
            .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); }
            .scrollbar-thin::-webkit-scrollbar { width: 6px; }
            .scrollbar-thin::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
          `}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
