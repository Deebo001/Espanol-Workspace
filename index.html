      const [evaluation, setEvaluation] = useState(null);

        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [messages, isTyping]);

      // Filter questions by Topic AND by Set
      const filteredQuestions = questionBank.filter(q => {
        const matchesTopic = q.topic === selectedWeek;
        const matchesSet = q.setNumber.toString() === selectedSetFilter;
        return matchesTopic && matchesSet;
      });

      const activeIndex = currentIndex < filteredQuestions.length ? currentIndex : 0;
      const currentQ = filteredQuestions[activeIndex] || questionBank[0];

      const resetQuestionState = () => {
        setSubmitted(false);
        setEvaluation(null);
        setUserText('');
        setSelectedOpt(null);
        setShowHint(false);
        setShowRule(false);
      };

      useEffect(() => {
        resetQuestionState();
      }, [currentIndex, selectedWeek, selectedSetFilter]);

      const insertAccent = (char) => setUserText(prev => prev + char);

      const handleSieleSubmit = () => {
        if (submitted) return;
        let isCorrect = false;

        if (currentQ.type === 'MULTIPLE_CHOICE') {
          isCorrect = selectedOpt === currentQ.correctAnswer;
        } else if (currentQ.type === 'FILL_IN_THE_BLANK') {
          isCorrect = userText.trim().toLowerCase() === currentQ.correctAnswer.toLowerCase();
        }

        const resStatus = isCorrect ? 'CORRECT' : 'INCORRECT';
        setEvaluation(resStatus);
        setSubmitted(true);

        setProgress(prev => ({
          ...prev,
          totalAttempted: prev.totalAttempted + 1,
          correct: isCorrect ? prev.correct + 1 : prev.correct,
          incorrect: !isCorrect ? prev.incorrect + 1 : prev.incorrect
        }));
      };

      const handleNextQuestion = () => {
        const nextIdx = (activeIndex + 1) % filteredQuestions.length;
        setCurrentIndex(nextIdx);
      };

      const handleVocabRating = (wordIndex, newStatus) => {
        if (weeklyVocabBank[selectedWeek] && weeklyVocabBank[selectedWeek][wordIndex]) {
          weeklyVocabBank[selectedWeek][wordIndex].status = newStatus;
          setProgress(prev => ({ ...prev, timestamp: Date.now() }));

      const generateImage = async (prompt) => {
        try {
          if (!apiKey) throw new Error("No API key");
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              instances: { prompt: `Cinematic urban street scene: ${prompt}` },
              parameters: { sampleCount: 1 }
            })
          });
          const result = await response.json();
          return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
        } catch (err) {
          return "https://images.unsplash.com/photo-1573002813597-881ca05720f1?auto=format&fit=crop&q=80&w=1000";
        }
      };

      const handleAddCustomCard = async (e) => {
        e.preventDefault();
        if (!customPhrase.trim() || !customMeaning.trim()) return;
        setIsGeneratingCard(true);
        setIsCustomModalOpen(false);
        try {
          const imageUrl = await generateImage(customPhrase);
          const newCard = {
            phrase: customPhrase.trim(),
            meaning: customMeaning.trim(),
            context: customContext.trim() || "Custom card added by you.",
            image: imageUrl,
            isCustom: true
          };
          setCards(prev => [...prev, newCard]);
          setCardIndex(cards.length);
          setShowMeaning(false);
          setCustomPhrase('');
          setCustomMeaning('');
          setCustomContext('');
        } catch (err) {} finally {
          setIsGeneratingCard(false);
        }
      };

      const deleteCurrentCard = () => {
        if (cards.length <= 1) return;
        const updatedCards = cards.filter((_, idx) => idx !== cardIndex);
        setCards(updatedCards);
        setCardIndex(Math.max(0, cardIndex - 1));
      };

      const generateNewCard = async () => {
        setIsGeneratingCard(true);
        try {
          if (!apiKey) throw new Error("No API key provided");
          const prompt = "Generate one unique Mexican street slang phrase, its English meaning, and a short cultural context. Return as JSON with keys: phrase, meaning, context.";
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const result = await response.json();
          const cardData = JSON.parse(result.candidates[0].content.parts[0].text);
          const imageUrl = await generateImage(cardData.phrase);
          const newCard = { ...cardData, image: imageUrl, isCustom: false };
          setCards(prev => [...prev, newCard]);
          setCardIndex(cards.length);
          setShowMeaning(false);
        } catch (err) {
          // Cycle through extra slang items if offline / no key
          const extraSlang = [
            { phrase: "¡Qué padre!", meaning: "How cool / awesome!", context: "Very common Mexican expression.", image: "https://images.unsplash.com/photo-1512818011718-d9de36709893?auto=format&fit=crop&q=80&w=1000", isCustom: false },
            { phrase: "Camára", meaning: "Got it / Agreed / Deal!", context: "Street slang to confirm agreement.", image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=1000", isCustom: false },
            { phrase: "Chale", meaning: "Bummer / Give me a break", context: "Expressing mild disappointment.", image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=1000", isCustom: false }
          ];
          const nextCard = extraSlang[cards.length % extraSlang.length];
          setCards(prev => [...prev, nextCard]);
          setCardIndex(cards.length);
          setShowMeaning(false);
        } finally {
          setIsGeneratingCard(false);
        }
      };

      const playAudio = async (text, id) => {
        if (isPlaying || !apiKey) return;
        setIsPlaying(id);
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Say this naturally: ${text}` }] }],
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Iapetus" } } }
              }
            })
          });
          const result = await response.json();
          const pcmData = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
          if (pcmData) {
            const audioBlob = pcmToWav(pcmData, 24000); 
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            audio.onended = () => { setIsPlaying(null); URL.revokeObjectURL(audioUrl); };
            await audio.play();
          } else {
            setIsPlaying(null);
          }
        } catch (err) {
          setIsPlaying(null);
        }
      };

      const pcmToWav = (base64Pcm, sampleRate) => {
        const bytes = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0));
        const pcmBuffer = bytes.buffer;
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        };
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + pcmBuffer.byteLength, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, pcmBuffer.byteLength, true);
        return new Blob([wavHeader, pcmBuffer], { type: 'audio/wav' });
      };

      const handleSend = async () => {
        if (!input.trim()) return;
        const userMsg = input;
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setInput('');
        setIsTyping(true);

        try {
          if (!apiKey) {
            // Local fallback reply if no key present
            setTimeout(() => {
              setMessages(prev => [...prev, { role: 'assistant', text: `¡Órale carnal! Entendí: "${userMsg}". Vamos a seguir practicando el español de la calle.` }]);
              setIsTyping(false);
            }, 600);
            return;
          }

          const sys = "You are a friendly Mexican street-smart tutor. Speak informally. Provide English translations in brackets.";
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userMsg }] }],
              systemInstruction: { parts: [{ text: sys }] }
            })
          });
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "¡Órale! Todo bien carnal.";
          setMessages(prev => [...prev, { role: 'assistant', text: reply }]);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'assistant', text: "¡Chale! Tuve un detalle técnico, pero aquí andamos. ¿Qué más me cuentas?" }]);
        } finally {
          setIsTyping(false);
        }
      };

      const currentCard = cards[cardIndex] || initialSlangCards[0];
      const currentVocabList = weeklyVocabBank[selectedWeek] || weeklyVocabBank['Week 1: Present Tense Regular/Irregular & Daily Routines'];

      return (
        <div className="flex flex-col h-screen bg-stone-100 text-stone-900 font-sans">
          <header className="bg-stone-800 text-white p-4 shadow-md flex items-center justify-between border-b-4 border-orange-600">
            <div className="flex items-center gap-2">
              <span className="bg-orange-600 text-white font-black px-2.5 py-1 rounded text-sm">MX/SIELE</span>
              <h1 className="text-lg font-bold tracking-tight uppercase">Barrio & SIELE Mastery Coach</h1>
            </div>
            <div className="flex bg-stone-700 rounded-lg p-1 gap-1">
              <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'chat' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>Chat (Street)</button>
              <button onClick={() => setActiveTab('cards')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'cards' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>Escenas (Cards)</button>
              <button onClick={() => setActiveTab('coach')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${activeTab === 'coach' ? 'bg-orange-600 text-white shadow' : 'text-stone-300'}`}>SIELE Coach</button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden relative">
            {activeTab === 'chat' ? (
              <div className="h-full flex flex-col max-w-2xl mx-auto w-full p-4">
                <div ref={scrollRef} className="flex-1 overflow-y-auto space-y-4 pr-2 scrollbar-thin">
                  {messages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[85%] p-3 rounded-2xl relative shadow-md ${msg.role === 'user' ? 'bg-orange-600 text-white' : 'bg-white border shadow-sm'}`}>
                        <p className="whitespace-pre-wrap text-sm leading-relaxed pr-8">{msg.text}</p>
                        <button onClick={() => playAudio(msg.text, `chat-${i}`)} className={`absolute bottom-2 right-2 ${msg.role === 'user' ? 'text-orange-200' : 'text-stone-400'} hover:text-orange-500`}>
                          {isPlaying === `chat-${i}` ? <span className="animate-spin">⏳</span> : '🔊'}
                        </button>
                      </div>
                    </div>
                  ))}
                  {isTyping && <div className="text-xs text-stone-400 italic">Escribiendo...</div>}
                </div>
                <div className="mt-4 flex gap-2">
                  <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSend()} placeholder="Dime algo, carnal..." className="flex-1 p-3 rounded-xl border focus:ring-2 focus:ring-orange-500 bg-white shadow-inner" />
                  <button onClick={handleSend} disabled={isTyping} className="bg-stone-800 text-white px-5 rounded-xl hover:bg-stone-700 font-bold text-xs uppercase">Enviar</button>
                </div>
              </div>
            ) : activeTab === 'cards' ? (

                    {/* Front Side */}
                    <div className="absolute inset-0 w-full h-full backface-hidden bg-stone-300 rounded-3xl shadow-2xl overflow-hidden flex flex-col border-2 border-stone-200">
                      {isGeneratingCard ? (
                        <div className="absolute inset-0 bg-stone-800 flex flex-col items-center justify-center text-white space-y-4">
                           <span className="text-3xl animate-spin">⏳</span>
                           <p className="font-bold animate-pulse text-center px-4">Generando ilustración...</p>
                        </div>
                      ) : (
                        <div className="absolute inset-0 z-0">
                          <img src={currentCard.image} className="w-full h-full object-cover block" alt="visual context" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        </div>

                      {!isGeneratingCard && (

                  </div>
                  
                  {!isGeneratingCard && (
                    <button onClick={(e) => { e.stopPropagation(); playAudio(currentCard.phrase, 'card'); }} className="absolute -top-4 -right-4 z-30 p-3 bg-orange-600 rounded-full shadow-2xl text-white">🔊</button>
                  )}
                  {cards.length > 1 && !isGeneratingCard && (
                    <button onClick={(e) => { e.stopPropagation(); deleteCurrentCard(); }} className="absolute -top-4 -left-4 z-30 p-3 bg-stone-700 rounded-full text-red-400">🗑️</button>
                  )}
                </div>

                <div className="flex flex-wrap justify-center gap-3 max-w-md">
                  <button onClick={() => setCardIndex((prev) => (prev + 1) % cards.length)} className="bg-stone-300 text-stone-800 px-5 py-3 rounded-full font-bold text-xs uppercase">Repasar ({cardIndex + 1}/{cards.length})</button>
                  <button onClick={generateNewCard} disabled={isGeneratingCard} className="bg-stone-800 text-white px-5 py-3 rounded-full font-bold text-xs uppercase">AI Frase</button>
                  <button onClick={() => setIsCustomModalOpen(true)} className="bg-orange-600 text-white px-5 py-3 rounded-full font-bold text-xs uppercase">Mi Flash Gem</button>
                </div>
              </div>
            ) : (
              /* --- SIELE COACH TAB --- */
              <div className="h-full flex flex-col p-4 max-w-4xl mx-auto overflow-y-auto space-y-6">
                <div className="flex bg-stone-200 p-1.5 rounded-xl justify-between items-center">
                  <span className="text-xs font-bold text-stone-600 px-3">Gabor • Target: SIELE B2</span>
                  <div className="flex gap-2">
                    <button onClick={() => setCoachSubTab('practice')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'practice' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Practice</button>
                    <button onClick={() => setCoachSubTab('vocabulary')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'vocabulary' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Vocabulary (5 words/wk)</button>
                    <button onClick={() => setCoachSubTab('dashboard')} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${coachSubTab === 'dashboard' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Dashboard</button>
                  </div>
                </div>

                {/* SHARED WEEK SELECTOR FOR SIELE COACH */}
                <div className="bg-white p-3 rounded-xl border flex flex-wrap items-center justify-between gap-2 shadow-sm">
                  <label className="text-xs font-bold uppercase text-stone-500">Select Curriculum Week:</label>
                  <select
                    value={selectedWeek}
                    onChange={(e) => { setSelectedWeek(e.target.value); setCurrentIndex(0); }}
                    className="bg-stone-100 text-xs font-bold px-3 py-2 rounded border focus:ring-2 focus:ring-orange-500 flex-1 min-w-[280px]"
                  >
                    {allWeeksList.map(week => (
                      <option key={week} value={week}>{week}</option>
                    ))}
                  </select>
                </div>

                {coachSubTab === 'practice' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-6">
                    <div className="flex flex-wrap justify-between items-center border-b pb-3 text-xs gap-2">
                      <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded font-bold">Q {activeIndex + 1} of {filteredQuestions.length}</span>

                      {/* Set 1 or Set 2 Selector */}
                      <div className="flex bg-stone-100 p-1 rounded border">
                        <button onClick={() => { setSelectedSetFilter('1'); setCurrentIndex(0); }} className={`px-2.5 py-1 rounded text-xs font-bold ${selectedSetFilter === '1' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Set 1</button>
                        <button onClick={() => { setSelectedSetFilter('2'); setCurrentIndex(0); }} className={`px-2.5 py-1 rounded text-xs font-bold ${selectedSetFilter === '2' ? 'bg-orange-600 text-white' : 'text-stone-700'}`}>Set 2</button>
                      </div>

                      <span className="text-emerald-600 font-bold">Score: {progress.correct}/{progress.totalAttempted}</span>
                    </div>

                    <div>
                      <h3 className="text-xs font-bold text-stone-400 uppercase">Question ({currentQ.topic} - Set {selectedSetFilter})</h3>
                      <p className="text-lg font-semibold text-stone-900 mt-1">{currentQ.question}</p>
                      {currentQ.context && <div className="mt-2 p-3 bg-stone-50 border-l-4 border-orange-600 italic text-stone-700">"{currentQ.context}"</div>}
                    </div>

                    {currentQ.type === 'FILL_IN_THE_BLANK' && (
                      <div className="bg-stone-50 p-2 rounded-lg border flex flex-wrap gap-1">
                        <span className="text-xs text-stone-500 self-center mr-2">Accents:</span>
                        {['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'].map(c => (
                          <button key={c} onClick={() => insertAccent(c)} className="w-8 h-8 bg-white border rounded font-bold text-orange-600">{c}</button>
                        ))}
                      </div>
                    )}

                    <div className="space-y-3">
                      {currentQ.type === 'MULTIPLE_CHOICE' && (
                        <div className="space-y-2">
                          {currentQ.options.map(opt => (
                            <button
                              key={opt.id}
                              disabled={submitted}
                              onClick={() => setSelectedOpt(opt.id)}
                              className={`w-full text-left p-3.5 rounded-xl border transition ${selectedOpt === opt.id ? 'bg-orange-50 border-orange-600 text-orange-900 font-bold' : 'bg-stone-50 border-stone-200'}`}
                            >
                              <strong className="mr-2 text-orange-600">{opt.id})</strong> {opt.text}
                            </button>
                          ))}
                        </div>
                      )}

                      {currentQ.type === 'FILL_IN_THE_BLANK' && (
                        <div className="bg-stone-50 p-4 rounded-xl border flex items-center gap-2 text-lg flex-wrap">
                          <span>{currentQ.sentenceBefore}</span>
                          <input type="text" disabled={submitted} value={userText} onChange={e => setUserText(e.target.value)} placeholder="type here..." className="bg-white border-2 border-orange-500 px-3 py-1 rounded font-bold" />
                          <span>{currentQ.sentenceAfter}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex gap-2 pt-2 border-t">
                      {!submitted ? (
                        <button onClick={handleSieleSubmit} className="bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-2.5 rounded-xl shadow">Submit Answer</button>
                      ) : (
                        <div className="flex gap-2">
                          <button onClick={handleNextQuestion} className="bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl shadow">Continue →</button>
                          <button onClick={resetQuestionState} className="bg-stone-200 text-stone-800 font-bold px-4 py-2.5 rounded-xl">Redo</button>
                        </div>
                      )}
                      <button onClick={() => setShowHint(!showHint)} className="bg-stone-100 text-stone-700 px-4 py-2.5 rounded-xl font-semibold text-xs">Hint</button>
                      <button onClick={() => setShowRule(!showRule)} className="bg-stone-100 text-stone-700 px-4 py-2.5 rounded-xl font-semibold text-xs">Rule</button>
                    </div>

                    {showHint && <div className="p-3 bg-orange-50 border-l-4 border-orange-500 rounded text-xs text-orange-900">💡 Hint: {currentQ.keyPoint}</div>}
                    {showRule && <div className="p-3 bg-stone-50 border rounded text-xs text-stone-700"><strong>Rule:</strong> {currentQ.explanation}</div>}

                    {submitted && (
                      <div className="p-4 bg-stone-50 rounded-xl border space-y-1">
                        <div className="font-bold text-sm">{evaluation === 'CORRECT' ? '🟢 Correct' : '🔴 Incorrect'}</div>
                        <p className="text-xs text-stone-600"><strong>Model Answer:</strong> {currentQ.modelAnswer || currentQ.correctAnswer}</p>
                        <p className="text-xs text-stone-600"><strong>Explanation:</strong> {currentQ.explanation}</p>
                      </div>
                    )}
                  </div>
                )}

                {coachSubTab === 'vocabulary' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-4">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h2 className="text-lg font-bold text-stone-800">5 Words for: <span className="text-orange-600">{selectedWeek}</span></h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {currentVocabList.map((item, idx) => (
                        <div key={idx} className="bg-stone-50 p-4 rounded-xl border space-y-2">
                          <div className="flex justify-between items-center">
                            <h3 className="font-bold text-orange-600 text-base">{item.word}</h3>
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-100 text-orange-800">{item.status}</span>
                          </div>
                          <p className="text-xs text-stone-600">Meaning: <strong>{item.meaning}</strong></p>
                          <p className="text-xs text-stone-500 italic">"{item.example}"</p>
                          <div className="flex gap-1 pt-1">
                            <button onClick={() => handleVocabRating(idx, 'KNOW')} className="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2 py-1 rounded font-bold">Know It (🟢)</button>
                            <button onClick={() => handleVocabRating(idx, 'UNSURE')} className="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-2 py-1 rounded font-bold">Not Sure (🟡)</button>
                            <button onClick={() => handleVocabRating(idx, 'DONT_KNOW')} className="text-xs bg-rose-100 hover:bg-rose-200 text-rose-800 px-2 py-1 rounded font-bold">Don't Know (🔴)</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {coachSubTab === 'dashboard' && (
                  <div className="bg-white p-6 rounded-2xl shadow border space-y-6">
                    <h2 className="text-xl font-bold">Learner Dashboard ({progress.learnerName})</h2>
                    <div>
                      <h3 className="text-xs font-bold text-stone-400 uppercase mb-3">SIELE Readiness</h3>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {Object.entries(progress.sieleScores).map(([skill, score]) => (

          </main>

          {/* Modal */}

              <div className="bg-stone-900 border-2 border-orange-600 text-white w-full max-w-md rounded-2xl p-6 shadow-2xl">

                <form onSubmit={handleAddCustomCard} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Frase / Slang</label>

                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Significado en Inglés</label>
                    <input required type="text" placeholder="Ej. It's tough!" value={customMeaning} onChange={(e) => setCustomMeaning(e.target.value)} className="w-full p-3 rounded-xl bg-stone-800 border border-stone-700 text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-stone-400 mb-1">Contexto Cultural</label>
                    <textarea rows={2} placeholder="Context..." value={customContext} onChange={(e) => setCustomContext(e.target.value)} className="w-full p-3 rounded-xl bg-stone-800 border border-stone-700 text-white" />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsCustomModalOpen(false)} className="flex-1 py-3 bg-stone-800 rounded-xl font-bold uppercase text-xs">Cancelar</button>
                    <button type="submit" className="flex-1 py-3 bg-orange-600 rounded-xl font-bold uppercase text-xs shadow-lg">Crear</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{ __html: `
            .perspective-1000 { perspective: 1000px; }
            .preserve-3d { transform-style: preserve-3d; position: relative; }
            .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); }
            .scrollbar-thin::-webkit-scrollbar { width: 6px; }
            .scrollbar-thin::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
          `}} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
