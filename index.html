<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Español A2-B1 Mastery Coach</title>
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 2. React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- 3. Babel for live JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 4. Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Direct SVG Icon components for browser stability
    const CheckCircle = () => <span class="text-emerald-400">✓</span>;
    const XCircle = () => <span class="text-rose-400">✗</span>;
    const AlertCircle = () => <span class="text-amber-400">⚠️</span>;

    const initialProgress = {
      cefrLevel: 'A2 / B1 Entry',
      streak: 1,
      totalAttempted: 0,
      correct: 0,
      partiallyCorrect: 0,
      incorrect: 0,
      topicMastery: {
        'Ser vs Estar': 65,
        'Pretérito Indefinido': 45,
        'Direct Object Pronouns': 50
      }
    };

    function App() {
      const [progress, setProgress] = useState(initialProgress);
      const [userText, setUserText] = useState('');
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [feedback, setFeedback] = useState(null);

      const insertAccent = (char) => setUserText(prev => prev + char);

      const handleSubmit = () => {
        if (!selectedOpt && !userText) return;
        setSubmitted(true);
        setFeedback(selectedOpt === 'A' || userText.trim().toLowerCase() === 'estudié' ? 'CORRECT' : 'INCORRECT');
      };

      return (
        <div className="max-w-4xl mx-auto p-6 space-y-6">
          <header className="border-b border-slate-700 pb-4">
            <h1 className="text-2xl font-bold text-amber-400">Español A2-B1 Mastery Coach</h1>
            <p className="text-xs text-slate-400">Learner: Gabor • Status: Active Session</p>
          </header>

          <main className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold bg-amber-500/20 text-amber-300 px-3 py-1 rounded">Question 1 of 5</span>
              <span className="text-xs text-slate-400">Topic: Ser vs Estar</span>
            </div>

            <div>
              <h3 className="text-sm font-semibold text-amber-400">QUESTION</h3>
              <p className="text-lg mt-1 font-serif">"Hola, mi nombre ___ Gabor y ___ aprendiendo español."</p>
            </div>

            {/* Special Accent Keypad */}
            <div className="bg-slate-900/50 p-2 rounded-lg flex gap-2">
              <span className="text-xs text-slate-400 self-center">Accents:</span>
              {['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'].map(c => (
                <button key={c} onClick={() => insertAccent(c)} className="bg-slate-700 px-2.5 py-1 rounded text-amber-300 hover:bg-amber-500 hover:text-slate-950 font-bold">{c}</button>
              ))}
            </div>

            {/* Options */}
            <div className="space-y-2">
              {[
                { id: 'A', text: 'es / estoy' },
                { id: 'B', text: 'está / soy' },
                { id: 'C', text: 'es / soy' }
              ].map(opt => (
                <button
                  key={opt.id}
                  onClick={() => setSelectedOpt(opt.id)}
                  className={`w-full text-left p-3 rounded-lg border transition ${selectedOpt === opt.id ? 'bg-amber-500/20 border-amber-500 text-amber-200' : 'bg-slate-900/60 border-slate-700'}`}
                >
                  <strong className="mr-2">{opt.id})</strong> {opt.text}
                </button>
              ))}
            </div>

            <div className="flex gap-2">
              {!submitted ? (
                <button onClick={handleSubmit} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2 rounded.lg">Submit Answer</button>
              ) : (
                <button onClick={() => setSubmitted(false)} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2 rounded-lg">Continue</button>
              )}
            </div>

            {submitted && (
              <div className="p-4 bg-slate-900 rounded-lg border border-slate-700 space-y-2">
                <div className="font-bold text-sm">{feedback === 'CORRECT' ? '🟢 Correct' : '🔴 Incorrect'}</div>
                <p className="text-xs text-slate-300"><strong>Explanation:</strong> Use "ser" for name/identity (es) and "estar" + gerund for continuous actions (estoy aprendiendo).</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
