<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Español A2-B1 Mastery Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialProgress = {
      cefrLevel: 'A2 / B1 Entry',
      streak: 1,
      totalAttempted: 15,
      correct: 10,
      partiallyCorrect: 3,
      incorrect: 2,
      sieleScores: { reading: 65, listening: 55, writing: 40, speaking: 45 },
      topicMastery: {
        'Ser vs Estar': 65,
        'Present Tense Regular': 80,
        'Pretérito Indefinido': 45,
        'Pretérito Imperfecto': 35,
        'Direct Object Pronouns': 50,
        'Gustar & Similar Verbs': 70
      },
      wordsToReview: ['desarrollar', 'sin embargo', 'además', 'lograr', 'aprovechar']
    };

    function App() {
      const [activeTab, setActiveTab] = useState('practice');
      const [progress, setProgress] = useState(initialProgress);
      const [userText, setUserText] = useState('');
      const [selectedOpt, setSelectedOpt] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const [feedback, setFeedback] = useState(null);

      const insertAccent = (char) => setUserText(prev => prev + char);

      const handleSubmit = () => {
        if (!selectedOpt && !userText) return;
        setSubmitted(true);
        setFeedback(selectedOpt === 'A' ? 'CORRECT' : 'INCORRECT');
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
          {/* Top Bar */}
          <header className="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
              <h1 className="text-2xl font-bold text-amber-400">Español A2-B1 Mastery Coach</h1>
              <p className="text-xs text-slate-400">Learner: Gabor • Target: SIELE B2</p>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setActiveTab('practice')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'practice' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
              >
                Practice
              </button>
              <button 
                onClick={() => setActiveTab('dashboard')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
              >
                Dashboard
              </button>
            </div>
          </header>

          {activeTab === 'practice' ? (
            <main className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6 shadow-xl">
              <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                <span className="text-xs font-bold bg-amber-500/20 text-amber-300 px-3 py-1 rounded">Question 1 of 5</span>
                <span className="text-xs text-slate-400">Topic: Ser vs Estar</span>
              </div>

              <div>
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">QUESTION</h3>
                <p className="text-lg text-slate-100 font-serif">"Hola, mi nombre ___ Gabor y ___ aprendiendo español para el examen SIELE."</p>
              </div>

              {/* Accent Keys */}
              <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80">
                <span className="text-xs text-slate-400 block mb-1">On-Screen Accent Keys:</span>
                <div className="flex flex-wrap gap-1.5">
                  {['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'].map((c) => (
                    <button 
                      key={c} 
                      onClick={() => insertAccent(c)} 
                      className="w-8 h-8 bg-slate-700 text-amber-300 hover:bg-amber-500 hover:text-slate-950 rounded font-bold transition"
                    >
                      {c}
                    </button>
                  ))}
                </div>
              </div>

              {/* Options */}
              <div className="space-y-2">
                {[
                  { id: 'A', text: 'es / estoy' },
                  { id: 'B', text: 'está / soy' },
                  { id: 'C', text: 'es / soy' },
                  { id: 'D', text: 'está / estoy' }
                ].map((opt) => (
                  <button
                    key={opt.id}
                    onClick={() => setSelectedOpt(opt.id)}
                    className={`w-full text-left p-3.5 rounded-lg border transition ${
                      selectedOpt === opt.id ? 'bg-amber-500/20 border-amber-500 text-amber-200' : 'bg-slate-900/60 border-slate-700 text-slate-200'
                    }`}
                  >
                    <strong className="mr-2 text-amber-400">{opt.id})</strong> {opt.text}
                  </button>
                ))}
              </div>

              <div className="flex gap-2 pt-2 border-t border-slate-700">
                {!submitted ? (
                  <button onClick={handleSubmit} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm transition">
                    Submit Answer
                  </button>
                ) : (
                  <button onClick={() => setSubmitted(false)} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm transition">
                    Continue
                  </button>
                )}
              </div>

              {submitted && (
                <div className="p-4 bg-slate-900 rounded-lg border border-slate-700 space-y-2">
                  <span className="text-xs font-bold px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                    🟢 Correct
                  </span>
                  <p className="text-xs text-slate-300 pt-1">
                    <strong>Explanation:</strong> Use "ser" for identity/names (es) and "estar" + gerund for continuous actions (estoy aprendiendo).
                  </p>
                </div>
              )}
            </main>
          ) : (
            <main className="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
              <h2 className="text-xl font-bold text-white border-b border-slate-700 pb-3">Learner Dashboard</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {Object.entries(progress.sieleScores).map(([skill, score]) => (
                  <div key={skill} className="bg-slate-900 p-3.5 rounded-xl border border-slate-700 text-center">
                    <span className="text-xs text-slate-400 uppercase font-bold block mb-1">{skill}</span>
                    <span className="text-2xl font-black text-amber-400">{score}%</span>
                  </div>
                ))}
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
